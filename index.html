function ldFB(){if(!fbOK||!fbDB)return Promise.resolve(null);return new Promise(resolve=>{const timer=setTimeout(()=>resolve(null),6000);fbDB.collection('shops').doc('main').get().then(doc=>{clearTimeout(timer);if(doc.exists){const d=doc.data();if(d._updatedAt&&typeof d._updatedAt.toDate==='function')d._updatedAt=d._updatedAt.toDate().toISOString();resolve(d)}else resolve(null)}).catch(e=>{clearTimeout(timer);console.error('FB ld:',e);resolve(null)})})}

let _st=null;
function sd(){
    sdL();
    if(!fbOK||!fbDB){setSS('offline');return;}
    setSS('wait');
    clearTimeout(_st);
    // مزامنة فورية بدون تأخير
    fbW = true;
    fbDB.collection('shops').doc('main').set({
        ...AD,
        _updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        fbW = false;
        setSS('synced');

    }).catch(e => {

}

function normN(n){if(!n)return'';let s=n.trim();if(PN[s])return PN[s];let r=s;if(r.startsWith('ال'))r=r.slice(2);if(PN[r])return PN[r];const w=s.split(/\s+/),nw=w.map(x=>WN[x]||x);let j=nw.join(' ');if(PN[j])return PN[j];if(j.startsWith('ال')){let j2=j.slice(2);if(PN[j2])return PN[j2]}if(nw.length===1&&PN[nw[0]])return PN[nw[0]];return j}
function findPr(i){if(!AD.products||!AD.products.length)return null;const ps=AD.products;let f=ps.find(p=>p.name===i);if(f)return f;const ni=normN(i);f=ps.find(p=>p.name===ni);if(f)return f;f=ps.find(p=>normN(p.name)===ni);if(f)return f;const iw=ni.split(/\s+/).filter(w=>w&&!/^\d+$/.test(w));if(iw.length){let bm=null,bs=0;for(const p of ps){const pw=normN(p.name).split(/\s+/).filter(w=>w);let sc=0;for(const w of iw)if(pw.some(x=>x===w||x.includes(w)||w.includes(x)))sc++;if(sc>=Math.ceil(iw.length*.7)&&sc>bs){bs=sc;bm=p}}if(bm)return bm}const pt=ps.filter(p=>{const pn=normN(p.name);return pn.includes(ni)||ni.includes(pn)});if(pt.length){pt.sort((a,b)=>Math.abs(normN(a.name).length-ni.length)-Math.abs(normN(b.name).length-ni.length));return pt[0]}const nc=ni.replace(/\s/g,'');return ps.find(p=>p.name.replace(/\s/g,'')===nc||normN(p.name).replace(/\s/g,'')===nc)||null}

function parseIL(l){let s=toWN(l.trim()).replace(/\s+/g,' ').trim();if(!s)return null;const nm=s.match(/^(\d+)/);if(!nm)return null;const q=parseInt(nm[1],10);let r=s.slice(nm[0].length).trim();let ec=0,en='';const ep=r.match(/\+\s*(\d+)\s*جنيه?\s*(.*)/);if(ep){ec=parseInt(ep[1],10);en=(ep[2]||'').trim();r=r.substring(0,r.indexOf('+')).trim()}if(/^جنيه?\s*(.*)/.test(r)){const g=r.match(/^جنيه?\s*(.*)/);return{productName:'كاش',normalizedProduct:'كاش',qty:1,unitPrice:q,total:q,extraCash:0,extraNote:g[1]||'',priceFound:true,isCash:true}}if(r){const nn=normN(r),pr=findPr(nn);return{productName:r,normalizedProduct:nn,qty:q,unitPrice:pr?pr.price:null,total:pr?q*pr.price:0,extraCash:ec,extraNote:en,priceFound:!!pr}}return{productName:'كاش',normalizedProduct:'كاش',qty:1,unitPrice:q,total:q,extraCash:0,extraNote:'',priceFound:true,isCash:true}}
function parseT(t){if(!t||!t.trim())return{customers:[],debug:[]};let s=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');const L=s.split('\n').map(l=>l.trim()),C=[],D=[];let cn=null,ci=[],co=[];function fl(){if(cn&&ci.length){const tot=ci.reduce((a,i)=>a+i.total+(i.extraCash||0),0);C.push({id:uuid(),name:cn,originalText:co.join('\n'),items:[...ci],total:tot,paid:0,remaining:tot,status:'unpaid',payments:[],createdAt:nw(),updatedAt:nw()})}cn=null;ci=[];co=[]}for(let i=0;i<L.length;i++){const l=L[i];if(!l)continue;if(/^\d/.test(toWN(l))){if(!cn){cn='شخص';D.push({type:'name',text:'(بدون اسم)'})}const it=parseIL(l);if(it){ci.push(it);co.push(l);D.push({type:'item',text:l,result:it.isCash?'كاش:'+it.total:(it.normalizedProduct+' ×'+it.qty+(it.priceFound?' ='+it.total+'ج':' ❌')),ok:it.priceFound})}else D.push({type:'item',text:l,result:'مقدرش أحلل',ok:false})}else{if(cn&&ci.length)fl();cn=l;co=[l];D.push({type:'name',text:l})}}fl();return{customers:C,debug:D}}

    try{const local=ldL();AD=local||defAD()}catch(e){AD=defAD()}
    try{initDM()}catch(e){}
    
    // مزامنة فورية عند بدء التشغيل

        try{
            const ls=document.getElementById('ls');

                bgSync();
                setupSync();
                // مزامنة كل 5 ثواني للتأكيد

                    if(fbOK && fbDB) {
                        bgSync();
                    }

            },500);
        }catch(e){console.error('show app:',e)}
    },1500);
}
