    <style>
        *{font-family:'Cairo',sans-serif}
        :root{--em:#059669;--em-l:#10b981;--em-d:#047857;--bg:#f0fdf4;--card:#fff;--tx:#1a1a2e;--mu:#6b7280;--bd:#e5e7eb;--ac:#f59e0b;--dg:#ef4444}
        .dark{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--ac:#fbbf24;--dg:#f87171}
        body{background:var(--bg);color:var(--tx)}
        .cs{background:var(--card);border:1px solid var(--bd)}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--em);border-radius:3px}
        #ls{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#047857,#059669 40%,#10b981);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
        #ls.fo{opacity:0;visibility:hidden}
        .lb{width:60px;height:45px;position:relative;margin-bottom:24px}
        .lb span{display:block;position:absolute;width:30px;height:45px;border-radius:2px 8px 8px 2px;background:rgba(255,255,255,.9)}
        .lb span:first-child{right:0;transform-origin:right center;animation:fR 1.2s infinite ease-in-out}
        .lb span:last-child{left:0;border-radius:8px 2px 2px 8px;transform-origin:left center;animation:fL 1.2s infinite ease-in-out}
        @keyframes fR{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-30deg)}}
        @keyframes fL{0%,100%{transform:rotateY(0)}50%{transform:rotateY(30deg)}}
        .lbr{width:120px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;margin-top:20px}
        .lbr i{display:block;width:0;height:100%;background:#fff;border-radius:2px;animation:lB 2s forwards ease-out}
        @keyframes lB{to{width:100%}}
        .pt{animation:pT 2s infinite}@keyframes pT{0%,100%{opacity:1}50%{opacity:.5}}
        .pg{display:none;animation:fU .3s ease}.pg.ac{display:block}
        @keyframes fU{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .pb{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}
        .pf{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--em),var(--em-l));transition:width .5s}
        .qb{transition:transform .15s,box-shadow .15s}.qb:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(5,150,105,.25)}.qb:active{transform:translateY(0)}
        .cc{transition:transform .2s,box-shadow .2s}.cc:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.1)}
        .bp{background:#d1fae5;color:#065f46}.bu{background:#fee2e2;color:#991b1b}
        .dark .bp{background:#064e3b;color:#6ee7b7}.dark .bu{background:#7f1d1d;color:#fca5a5}
        .pm{background:#fef3c7;color:#92400e}.dark .pm{background:#78350f;color:#fde68a}
        .swal2-popup{font-family:'Cairo',sans-serif!important}
        .debug-line{font-size:11px;padding:2px 6px;border-radius:4px;margin:1px 0}
        .debug-ok{background:#d1fae5;color:#065f46}
        .debug-fail{background:#fee2e2;color:#991b1b}
        .debug-name{background:#dbeafe;color:#1e40af;font-weight:700}
    </style>
</head>

<script>
// ==================== أدوات ====================
function uuid(){return'xxxx-xxxx-4xxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)})}
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function fmt(n){return(n||0).toLocaleString('ar-EG')}
function fdt(d){if(!d)return'';return new Date(d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'})}
function td(){return new Date().toISOString().split('T')[0]}
function nw(){return new Date().toISOString()}
function toWN(s){return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}

// ==================== التخزين ====================
const SK='daftar_app_data_v2';

        {id:uuid(),name:'بيبيسي كنز',price:15,category:'مرطبات',createdAt:nw()},
        {id:uuid(),name:'راني',price:20,category:'مرطبات',createdAt:nw()},

        {id:uuid(),name:'فول',price:12,category:'معلبات',createdAt:nw()},

let AD;
function ld(){
    try{
        const r=localStorage.getItem(SK);
        if(r){
            AD=JSON.parse(r);
            if(!AD.customers)AD.customers=[];
            if(!AD.merchandise)AD.merchandise=[];
            if(!AD.products||AD.products.length===0)AD.products=mkProducts();
            if(!AD.settings)AD.settings={darkMode:false};
        }else{
            AD={customers:[],merchandise:[],products:mkProducts(),settings:{darkMode:false}};
        }
    }catch(e){
        AD={customers:[],merchandise:[],products:mkProducts(),settings:{darkMode:false}};
    }
}
function sd(){try{localStorage.setItem(SK,JSON.stringify(AD))}catch(e){console.error(e)}}

// ==================== التطبيع والمطابقة (المُصلَح) ====================

// خريطة إصلاح الأخطاء الإملائية لكلمة واحدة
const WN={
    'ببسي':'بيبيسي','بيبسى':'بيبيسي','بيبسي':'بيبيسي','بيبس':'بيبيسي','بيبيسى':'بيبيسي',
    'جبنه':'جبنة','جبن':'جبنة',
    'مايه':'مايه','ماية':'مايه','ميه':'مايه','ميا':'مايه',
    'مكرونه':'مكرونه','مكرونة':'مكرونه',
    'صلصه':'صلصه','صلصة':'صلصه',
    'دومتي':'دومتي','دامتي':'دومتي',

// تطبيع اسم منتج (يدعم الأسماء المركبة بالكامل)
function normN(name){
    if(!name)return'';
    let n=name.trim();

    // 1- تطبيع مباشر من خريطة العبارات
    if(PN[n])return PN[n];

    // 2- إزالة "ال" في البداية
    let rr=n;
    if(rr.startsWith('ال'))rr=rr.slice(2);
    if(PN[rr])return PN[rr];

    // 3- تطبيع كلمة بكلمة (إصلاح الأخطاء الإملائية)
    const words=n.split(/\s+/);
    const normWords=words.map(w=>WN[w]||w);
    let joined=normWords.join(' ');

    // 4- محاولة مطابقة العبارات بعد التطبيع
    if(PN[joined])return PN[joined];

    // 5- محاولة إزالة "ال" من الكلمة الأولى بعد التطبيع
    if(joined.startsWith('ال')){
        let j2=joined.slice(2);
        if(PN[j2])return PN[j2];
    }

    // 6- لو كلمة واحدة، دور في PN
    if(normWords.length===1&&PN[normWords[0]])return PN[normWords[0]];

    // 7- لو عدد الكلمات 2+، حاول تطبيع العبارات الفرعية
    // مثلاً: "بيبيسي لتر" → "بيبيسي كنز" (لو مفيش تطبيع، يرجع النص كما هو)
    return joined;
}

// مطابقة منتج (محسّنة للأسماء المركبة)
function findPr(inputName){
    if(!AD.products||AD.products.length===0)return null;
    const products=AD.products;

    // 1- مطابقة تامة
    let f=products.find(p=>p.name===inputName);
    if(f)return f;

    // 2- مطابقة بعد التطبيع
    const ni=normN(inputName);
    f=products.find(p=>p.name===ni);
    if(f)return f;
    f=products.find(p=>normN(p.name)===ni);
    if(f)return f;

    // 3- مطابقة شاملة: كل كلمات المدخل موجودة في اسم المنتج
    // (باستثناء الأرقام المنفصلة زي "1" و"2")
    const iw=ni.split(/\s+/).filter(w=>w.length>0&&!/^\d+$/.test(w));
    if(iw.length>0){
        // دور على المنتج اللي كل كلماته موجودة فيه
        let bestMatch=null,bestScore=0;
        for(const p of products){
            const pn=normN(p.name);
            const pw=pn.split(/\s+/).filter(w=>w.length>0);
            // عدد كلمات المدخل الموجودة في المنتج
            let score=0;
            for(const w of iw){
                if(pw.some(x=>x===w||x.includes(w)||w.includes(x)))score++;
            }
            // لازم كل كلمات المدخل تتحقق (أو على الأقل الأغلبية)
            if(score>=Math.ceil(iw.length*0.7)&&score>bestScore){
                bestScore=score;bestMatch=p;
            }
        }
        if(bestMatch)return bestMatch;
    }

    // 4- مطابقة جزئية (المدخل جزء من اسم المنتج أو العكس)
    // نفضّل المطابقة اللي أقرب في الطول
    const partials=products.filter(p=>{
        const pn=normN(p.name);
        return pn.includes(ni)||ni.includes(pn);
    });
    if(partials.length>0){
        partials.sort((a,b)=>Math.abs(normN(a.name).length-ni.length)-Math.abs(normN(b.name).length-ni.length));
        return partials[0];
    }

    // 5- مطابقة بدون مسافات
    const nc=ni.replace(/\s/g,'');
    f=products.find(p=>p.name.replace(/\s/g,'')===nc||normN(p.name).replace(/\s/g,'')===nc);
    if(f)return f;

    return null;
}

// تحليل سطر واحد (عنصر/بضاعة)
function parseIL(line){
    let l=line.trim();
    if(!l)return null;

    // تحويل الأرقام العربية/الهندية
    l=toWN(l);
    // تنظيف المسافات
    l=l.replace(/\s+/g,' ').trim();

    // استخراج الرقم الأول (الكمية)
    const nm=l.match(/^(\d+)/);
    if(!nm)return null; // مفيش رقم = مش عنصر

    const qty=parseInt(nm[1],10);
    let rest=l.slice(nm[0].length).trim();

    // استخراج "+ X جنيه" (مبلغ إضافي)
    let extraCash=0,extraNote='';
    const ep=rest.match(/\+\s*(\d+)\s*جنيه?\s*(.*)/);
    if(ep){
        extraCash=parseInt(ep[1],10);
        extraNote=(ep[2]||'').trim();
        const pi=rest.indexOf('+');
        rest=rest.substring(0,pi).trim();
    }

    // "جنيه" لوحده بعد رقم = مبلغ كاش
    if(/^جنيه?\s*(.*)/.test(rest)){
        const gnM=rest.match(/^جنيه?\s*(.*)/);
        return{productName:'كاش',normalizedProduct:'كاش',qty:1,unitPrice:qty,total:qty,extraCash:0,extraNote:gnM[1]||'',priceFound:true,isCash:true};
    }

    if(rest){
        // فيه اسم منتج (ممكن مركب من كذا كلمة)
        const nn=normN(rest);
        const prod=findPr(nn);
        return{
            productName:rest,       // الاسم الأصلي كما كتبه المستخدم
            normalizedProduct:nn,   // الاسم بعد التطبيع
            qty,
            unitPrice:prod?prod.price:null,
            total:prod?qty*prod.price:0,
            extraCash,extraNote,
            priceFound:!!prod
        };
    }else{
        // رقم بس = مبلغ كاش
        return{productName:'كاش',normalizedProduct:'كاش',qty:1,unitPrice:qty,total:qty,extraCash:0,extraNote:'',priceFound:true,isCash:true};
    }
}

// تحليل النص الكامل (المُصلَح: يدعم الأسماء المركبة والأسماء بدون سطر فاضي)
function parseT(text){
    if(!text||!text.trim())return{customers:[],debug:[]};

    // تطبيع نهايات السطور
    let t=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

    // تقسيم لسطور
    const allLines=t.split('\n').map(l=>l.trim());

    const customers=[];
    const debug=[];
    let currentName=null;
    let currentItems=[];
    let currentOriginal=[];

    // حفظ شخص ومنتجاته
    function flush(){
        if(currentName&&currentItems.length>0){
            const total=currentItems.reduce((s,it)=>s+it.total+(it.extraCash||0),0);
            customers.push({
                id:uuid(),name:currentName,originalText:currentOriginal.join('\n'),
                items:[...currentItems],total,paid:0,remaining:total,status:'unpaid',
                payments:[],createdAt:nw(),updatedAt:nw()
            });
        }
        currentName=null;currentItems=[];currentOriginal=[];
    }

    for(let i=0;i<allLines.length;i++){
        const line=allLines[i];
        if(!line)continue; // سطر فاضي = فاصل بين الأشخاص

        const westernLine=toWN(line);
        // هل السطر يبدأ برقم؟ (عنصر/بضاعة)
        const startsWithNum=/^\d/.test(westernLine);

        if(startsWithNum){
            // هذا سطر عنصر (رقم + اسم منتج)
            if(!currentName){
                // أول سطر رقم من غير اسم قبله → نعتبره شخص بدون اسم
                currentName='شخص';
                debug.push({type:'name',text:'(شخص بدون اسم)'});
            }
            const item=parseIL(line);
            if(item){
                currentItems.push(item);
                currentOriginal.push(line);
                debug.push({
                    type:'item',text:line,
                    result:item.isCash?'كاش: '+item.total:(item.normalizedProduct+' ×'+item.qty+(item.priceFound?' = '+item.total+' ج':' ❌ سعر مش موجود')),
                    ok:item.priceFound
                });
            }else{
                debug.push({type:'item',text:line,result:'مقدرش أحلل السطر ده',ok:false});
            }
        }else{
            // السطر مش رقم → اسم شخص (جديد)
            // لو فيه شخص حالي بمنتجات → احفظه وابدأ شخص جديد
            if(currentName&&currentItems.length>0){
                flush();
            }
            // لو فيه اسم حالي من غير منتجات (اسم متكرر مثلاً) → حدّث الاسم
            if(currentItems.length===0){
                currentName=line;
                currentOriginal=[line];
                debug.push({type:'name',text:line});
            }else{
                // حالات نادرة: اسم جاء بعد منتجات من غير سطر فاضي
                flush();
                currentName=line;
                currentOriginal=[line];
                debug.push({type:'name',text:line});
            }
        }
    }

    // حفظ آخر شخص
    flush();

    return{customers,debug};
}

                html+='</p>';
            }
        });

    });

function renderC(){
    const sh=(document.getElementById('csh')||{}).value?.trim().toLowerCase()||'';
    const so=(document.getElementById('cso')||{}).value||'newest';
    let list=[...AD.customers];
    if(sh)list=list.filter(c=>c.name.toLowerCase().includes(sh));
    if(CF==='paid')list=list.filter(c=>c.status==='paid');
    else if(CF==='unpaid')list=list.filter(c=>c.status==='unpaid');
    if(so==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    else if(so==='newest')list.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    else if(so==='highest')list.sort((a,b)=>b.total-a.total);

    le.innerHTML=list.map(c=>rCC(c)).join('');lucide.createIcons();uFB();

function rCC(c){
    const sb=c.status==='paid'?'<span class="bp px-2 py-0.5 rounded-full text-xs font-semibold">دفع</span>':'<span class="bu px-2 py-0.5 rounded-full text-xs font-semibold">لسه مدفعش</span>';
    let ih=c.items.map(it=>{
        if(it.isCash)return`<div class="flex justify-between text-sm py-1" style="color:var(--mu)"><span>مبلغ كاش</span><span class="font-semibold">${fmt(it.total)} ج</span></div>`;
        const pi=it.priceFound?`<span class="text-xs">(الوحدة: ${fmt(it.unitPrice)} ج)</span>`:`<span class="pm text-xs px-1.5 py-0.5 rounded cursor-pointer" onclick="addMP('${esc(it.normalizedProduct||it.productName)}')">السعر مش موجود - اضغط هنا</span>`;
        const eh=it.extraCash>0?`<span class="text-xs text-amber-600 block">+ ${fmt(it.extraCash)} ج ${esc(it.extraNote||'')}</span>`:'';
        return`<div class="py-1"><div class="flex justify-between text-sm" style="color:var(--mu)"><span>${esc(it.normalizedProduct||it.productName)} &times; ${fmt(it.qty)} ${pi}</span><span class="font-semibold">${it.priceFound?fmt(it.total)+' ج':'---'}</span></div>${eh}</div>`;
    }).join('');
    let ph='';if(c.payments&&c.payments.length>0){ph=`<div class="mt-3 pt-3 border-t" style="border-color:var(--bd)"><p class="text-xs font-semibold mb-2" style="color:var(--mu)">سجل الدفعات</p>${c.payments.map(p=>`<div class="flex justify-between text-xs py-1" style="color:var(--mu)"><span>${fdt(p.date)}${p.note?' - '+esc(p.note):''}</span><span class="text-green-600 font-semibold">${fmt(p.amount)} ج</span></div>`).join('')}</div>`}
    return`<div class="cc cs rounded-2xl shadow-sm overflow-hidden"><div class="p-4"><div class="flex items-center justify-between mb-3"><h4 class="font-bold text-lg" style="color:var(--tx)">${esc(c.name)}</h4>${sb}</div><div class="divide-y" style="border-color:var(--bd)">${ih}</div><div class="mt-3 pt-3 border-t flex justify-between items-center" style="border-color:var(--bd)"><span class="font-bold" style="color:var(--tx)">الإجمالي</span><span class="font-bold text-emerald-600">${fmt(c.total)} ج</span></div><div class="flex justify-between text-sm" style="color:var(--mu)"><span>المدفوع</span><span class="text-green-600">${fmt(c.paid)} ج</span></div><div class="flex justify-between text-sm font-semibold" style="color:var(--tx)"><span>المتبقي</span><span class="${c.remaining>0?'text-red-500':'text-green-600'}">${fmt(c.remaining)} ج</span></div>${ph}</div><div class="px-4 pb-4 flex flex-wrap gap-2"><button onclick="tCS('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${c.status==='paid'?'bg-red-50 dark:bg-red-900/20 text-red-600 hover:bg-red-100':'bg-green-50 dark:bg-green-900/20 text-green-600 hover:bg-green-100'} transition-all">${c.status==='paid'?'لسه مدفعش':' دفع'}</button><button onclick="aCP('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 hover:bg-emerald-100 transition-all">تسجيل دفعة</button><button onclick="eC('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 transition-all" style="color:var(--mu)">تعديل</button><button onclick="dC('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-50 dark:bg-red-900/20 text-red-500 hover:bg-red-100 transition-all">حذف</button></div></div>`;
}

function addMP(nn){
    Swal.fire({title:'إضافة سعر',html:`<div class="text-right"><label class="block text-sm mb-1 font-semibold">اسم الصنف</label><input id="s-pn" value="${esc(nn)}" class="swal2-input text-right"><label class="block text-sm mb-1 font-semibold mt-2">السعر</label><input id="s-pp" type="number" class="swal2-input text-right" placeholder="السعر بالجنيه"><label class="block text-sm mb-1 font-semibold mt-2">الفئة</label><input id="s-pc" class="swal2-input text-right" placeholder="الفئة"></div>`,showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',preConfirm:()=>{const n=document.getElementById('s-pn').value.trim(),p=parseFloat(document.getElementById('s-pp').value),c=document.getElementById('s-pc').value.trim();if(!n||!p||p<=0){Swal.showValidationMessage('لازم الاسم والسعر');return false}return{name:n,price:p,category:c||'عام'}}}).then(r=>{if(r.isConfirmed){AD.products.push({id:uuid(),name:r.value.name,price:r.value.price,category:r.value.category,createdAt:nw()});sd();rCP(r.value.name);renderC();toast('اتحفظ يا هندسة')}});

function rCP(nn){AD.customers.forEach(c=>{c.items.forEach(it=>{const inorm=normN(it.productName);if(inorm===nn||normN(inorm)===nn){const pr=findPr(inorm);if(pr&&!it.priceFound){it.unitPrice=pr.price;it.total=it.qty*pr.price;it.normalizedProduct=pr.name;it.priceFound=true}if(pr&&it.priceFound){it.unitPrice=pr.price;it.total=it.qty*pr.price;it.normalizedProduct=pr.name}}});c.total=c.items.reduce((s,it)=>s+it.total+(it.extraCash||0),0);c.remaining=c.total-c.paid;if(c.remaining<=0&&c.total>0)c.status='paid'});sd()}

    return`<div class="cc cs rounded-2xl shadow-sm p-4"><div class="flex items-center justify-between mb-3"><h4 class="font-bold text-lg" style="color:var(--tx)">${esc(m.name)}</h4><span class="text-xs font-semibold px-2 py-0.5 rounded-full ${pct>=100?'bp':'bu'}">${pct>=100?'خلصان':pct+'%'}</span></div><div class="space-y-1 text-sm" style="color:var(--mu)"><div class="flex justify-between"><span>إجمالي الحساب</span><span class="font-semibold" style="color:var(--tx)">${fmt(m.totalAmount)} ج</span></div><div class="flex justify-between"><span>المدفوع</span><span class="font-semibold text-green-600">${fmt(pd)} ج</span></div><div class="flex justify-between"><span>المتبقي</span><span class="font-semibold ${rm>0?'text-red-500':'text-green-600'}">${fmt(rm)} ج</span></div></div><div class="pb mt-3 mb-1"><div class="pf" style="width:${pct}%"></div></div>${lp?`<p class="text-xs mb-2" style="color:var(--mu)">آخر دفعة: ${fdt(lp.date)} - ${fmt(lp.amount)} ج</p>`:''}${ph}<div class="flex flex-wrap gap-2 mt-3"><button onclick="aMPay('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 hover:bg-emerald-100 transition-all">إضافة دفعة</button><button onclick="eM('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 transition-all" style="color:var(--mu)">تعديل</button><button onclick="dM('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-50 dark:bg-red-900/20 text-red-500 hover:bg-red-100 transition-all">حذف</button></div></div>`;

function addP(){Swal.fire({title:'زوّد صنف',html:`<div class="text-right"><label class="block text-sm mb-1 font-semibold">اسم المنتج</label><input id="s-pn2" class="swal2-input text-right" placeholder="الاسم"><label class="block text-sm mb-1 font-semibold mt-2">السعر</label><input id="s-pp2" type="number" class="swal2-input text-right" placeholder="السعر بالجنيه"><label class="block text-sm mb-1 font-semibold mt-2">الفئة</label><input id="s-pc2" class="swal2-input text-right" placeholder="الفئة"></div>`,showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',preConfirm:()=>{const n=document.getElementById('s-pn2').value.trim(),p=parseFloat(document.getElementById('s-pp2').value),c=document.getElementById('s-pc2').value.trim();if(!n||!p||p<=0){Swal.showValidationMessage('لازم الاسم والسعر');return false}return{name:n,price:p,category:c||'عام'}}}).then(r=>{if(r.isConfirmed){AD.products.push({id:uuid(),name:r.value.name,price:r.value.price,category:r.value.category,createdAt:nw()});sd();renderP();toast('اتحفظ يا هندسة')}})}
function eP(id){const p=AD.products.find(x=>x.id===id);if(!p)return;Swal.fire({title:'تعديل الصنف',html:`<div class="text-right"><label class="block text-sm mb-1 font-semibold">اسم المنتج</label><input id="s-epn" value="${esc(p.name)}" class="swal2-input text-right"><label class="block text-sm mb-1 font-semibold mt-2">السعر</label><input id="s-epp" type="number" value="${p.price}" class="swal2-input text-right"><label class="block text-sm mb-1 font-semibold mt-2">الفئة</label><input id="s-epc" value="${esc(p.category||'')}" class="swal2-input text-right"></div>`,showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',preConfirm:()=>{const n=document.getElementById('s-epn').value.trim(),p2=parseFloat(document.getElementById('s-epp').value),c=document.getElementById('s-epc').value.trim();if(!n||!p2||p2<=0){Swal.showValidationMessage('لازم الاسم والسعر');return false}return{name:n,price:p2,category:c||'عام'}}}).then(r=>{if(r.isConfirmed){const on=normN(p.name);p.name=r.value.name;p.price=r.value.price;p.category=r.value.category;sd();rCP(on);rCP(normN(p.name));renderP();toast('تم التعديل')}})}
function dP(id){Swal.fire({icon:'warning',title:'متأكد إنك عايز تمسح؟',text:'لو مسحت السعر، الحسابات الجديدة مش هتلاقيه',showCancelButton:true,confirmButtonText:'امسح',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444'}).then(r=>{if(r.isConfirmed){AD.products=AD.products.filter(p=>p.id!==id);sd();renderP();toast('تم الحذف','info')}})}

// ==================== الوضع الداكن ====================
function toggleDark(){const d=document.documentElement.classList.toggle('dark');AD.settings.darkMode=d;sd();uDI()}
function uDI(){const d=document.documentElement.classList.contains('dark');document.querySelectorAll('[data-lucide="moon"],[data-lucide="sun"]').forEach(e=>{e.setAttribute('data-lucide',d?'sun':'moon')});lucide.createIcons()}
function initDM(){if(AD.settings.darkMode)document.documentElement.classList.add('dark');uDI()}

// ==================== تصدير/استيراد ====================
function exportData(){const j=JSON.stringify(AD,null,2),b=new Blob([j],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='daftar_backup_'+td()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('تم التصدير')}
function importData(){document.getElementById('if').click()}
function hImp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(x){try{const d=JSON.parse(x.target.result);if(!d.customers||!d.merchandise||!d.products){Swal.fire({icon:'error',title:'ملف مش صحيح!',confirmButtonText:'فهمت'});return}Swal.fire({icon:'warning',title:'استيراد البيانات؟',text:'البيانات الحالية هتتمسح',showCancelButton:true,confirmButtonText:'استيراد',cancelButtonText:'إلغاء',confirmButtonColor:'#059669'}).then(res=>{if(res.isConfirmed){AD=d;sd();renderAll();toast('تم الاستيراد')}})}catch(err){Swal.fire({icon:'error',title:'خطأ!',text:'مقدرش أقرأ الملف',confirmButtonText:'فهمت'})}};r.readAsText(f);e.target.value=''}
function clearAllData(){Swal.fire({icon:'warning',title:'مسح كل البيانات؟',text:'كل حاجة هتتمسح!',showCancelButton:true,confirmButtonText:'امسح كل حاجة',cancelButtonText:'إلغاء',confirmButtonColor:'#ef4444'}).then(r=>{if(r.isConfirmed){AD={customers:[],merchandise:[],products:mkProducts(),settings:AD.settings};sd();renderAll();toast('تم مسح كل البيانات','info')}})}
function renderAll(){renderH();renderC();renderM();renderP()}

function init(){ld();initDM();setTimeout(()=>{const ls=document.getElementById('ls');ls.classList.add('fo');setTimeout(()=>{ls.style.display='none';document.getElementById('app').classList.remove('hidden');switchPage('home');if(typeof AOS!=='undefined')AOS.init({duration:600,once:true,offset:50})},600)},2200)}
document.addEventListener('DOMContentLoaded',init);
</script>
